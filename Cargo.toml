[package]
name = "internet"
version = "0.2.0"
edition = "2024"
description = "Single-owner Windows and WSL network CLI"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
