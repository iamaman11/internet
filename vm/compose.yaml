# Native Compose owns three production dataplane services plus isolated, opt-in iPhone Mesh (#11).
# Supply immutable, verified @sha256 images before running.
name: internet

services:
  warp-egress:
    image: ${INTERNET_WARP_IMAGE:?Set a verified WARP image pinned by digest}
    restart: unless-stopped
    # Guard is installed before the image's original WARP/GOST entrypoint.
    entrypoint: ["/bin/sh", "/etc/internet/gost-guard-entrypoint.sh"]
    # Full WARP network mode + GOST SOCKS5 UDP ASSOCIATE, never WARP proxy mode.
    environment:
      WARP_ENABLE_NAT: "1"
      GOST_ARGS: "-L=socks5://:11080"
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - warp-state:/var/lib/cloudflare-warp
      - ./warp/gost-guard-entrypoint.sh:/etc/internet/gost-guard-entrypoint.sh:ro
      - ./warp/gost-egress-guard.nft:/etc/internet/gost-egress-guard.nft:ro
    networks:
      - edge

  line1-gateway:
    image: ${INTERNET_SING_BOX_IMAGE:?Set a verified sing-box image pinned by digest}
    restart: unless-stopped
    command: ["run", "-c", "/etc/sing-box/config.json"]
    volumes:
      - ./runtime/line1.json:/etc/sing-box/config.json:ro
      - certificate-state:/var/lib/sing-box
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "8443:8443/udp"
      - "5443:5443/tcp"
      - "9444:9444/udp"
    networks:
      - edge

  line2-proxy:
    image: ${INTERNET_SING_BOX_IMAGE:?Set a verified sing-box image pinned by digest}
    restart: unless-stopped
    command: ["run", "-c", "/etc/sing-box/config.json"]
    volumes:
      - ./runtime/line2.json:/etc/sing-box/config.json:ro
      - certificate-state:/var/lib/sing-box:ro
      - ./runtime/tls:/etc/sing-box/tls:ro
    ports:
      - "3128:3128/tcp"
      - "1080:1080/tcp"
      - "9443:9443/tcp"
      - "4128:4128/tcp"
      - "4080:4080/tcp"
      - "4443:4443/tcp"
    networks:
      - edge


  # S3: opt-in only, never started during normal 3-service Compose operations.
  # This one Mesh identity belongs exclusively to the authorized personal
  # Cloudflare tenant for iPhone; no adoption of pre-existing Mesh nodes.
  cloudflare-mesh:
    profiles: ["mobile"]
    image: cloudflare/mesh@sha256:1c135f07ddac619562f45da5816b25d3ac7663a491c2a065bd83c005007dec5e
    restart: unless-stopped
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      SRCNAT_ENABLED: "true"
    # Created only after Vault capture; never commit runtime/mesh-node.env.
    env_file:
      - path: ./runtime/mesh-node.env
        required: true
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.default.forwarding: "1"
    volumes:
      - mesh-state:/var/lib/cloudflare-warp
    networks:
      - mesh


networks:
  edge:
    driver: bridge
  mesh:
    driver: bridge

volumes:
  warp-state:
  certificate-state:
  mesh-state:
